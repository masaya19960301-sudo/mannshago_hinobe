<div class="container">
  <div class="card">
    <h2 class="section-title" id="form-title">日延案件 登録</h2>
    <div id="edit-banner" style="display:none;background:#FED7AA;color:#9A3412;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;">
      編集モード（既存レコードを更新します）
      <button type="button" id="cancel-edit-btn" class="btn btn-danger" style="float:right;padding:4px 10px;font-size:12px;min-height:0;">キャンセル</button>
    </div>
    <form id="record-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="deliveryDate">配送日<span class="required-mark">*</span></label>
        <input type="date" id="deliveryDate" class="form-input" required>
        <div class="field-error-msg" id="err-deliveryDate"></div>
      </div>

      <div class="form-group">
        <label class="form-label">伝票No・販売金額<span class="required-mark">*</span></label>
        <div id="slips-container"></div>
        <button type="button" id="add-slip-btn" class="btn btn-secondary" style="margin-top:8px;">＋ 行を追加</button>
        <div class="form-help">伝票Noは6桁の数字。最大10行まで追加できます。</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="storeName">店舗名（数字）<span class="required-mark">*</span></label>
        <input type="text" id="storeName" class="form-input" inputmode="numeric" pattern="\d*" required>
        <div class="field-error-msg" id="err-storeName"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="salesPerson">販売担当者（フルネーム）<span class="required-mark">*</span></label>
        <input type="text" id="salesPerson" class="form-input" required>
        <div class="form-help">空白を含めずに入力してください</div>
        <div class="field-error-msg" id="err-salesPerson"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="customerName">お客様名（フルネーム）<span class="required-mark">*</span></label>
        <input type="text" id="customerName" class="form-input" required>
        <div class="form-help">空白を含めずに入力してください</div>
        <div class="field-error-msg" id="err-customerName"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reason">理由<span class="required-mark">*</span></label>
        <select id="reason" class="form-select" required>
          <option value="">選択してください</option>
        </select>
        <div class="field-error-msg" id="err-reason"></div>
      </div>

      <div class="form-group">
        <label class="form-label">日延後の配送日<span class="required-mark">*</span></label>
        <div class="status-toggle">
          <label class="status-option">
            <input type="radio" name="postDelayDateStatus" value="決定" checked>
            <span>決定している</span>
          </label>
          <label class="status-option">
            <input type="radio" name="postDelayDateStatus" value="未定">
            <span>未定</span>
          </label>
        </div>
        <div id="post-delay-decided-wrap" style="margin-top:8px;">
          <input type="date" id="postDelayDateDecided" class="form-input">
        </div>
        <div id="post-delay-pending-wrap" style="margin-top:8px;display:none;">
          <input type="text" id="postDelayDatePending" class="form-input" placeholder="例：来週末、調整中、入荷待ち など" maxlength="100">
          <div class="form-help">日本語で自由に入力できます</div>
        </div>
        <div class="field-error-msg" id="err-postDelayDate"></div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">登録する</button>
    </form>
  </div>
</div>

<div id="dup-modal" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-header">重複データが見つかりました</div>
    <div class="modal-body">
      <div>
        伝票No <span id="dup-slip" class="dup-slip-badge"></span> は既に登録されています。
      </div>
      <div class="dup-meta">
        <dl>
          <dt>登録日時</dt><dd id="dup-timestamp"></dd>
          <dt>配送日</dt><dd id="dup-deliveryDate"></dd>
          <dt>伝票No</dt><dd id="dup-slipNumbers"></dd>
          <dt>金額合計</dt><dd id="dup-totalAmount"></dd>
          <dt>店舗</dt><dd id="dup-storeName"></dd>
          <dt>担当者</dt><dd id="dup-salesPerson"></dd>
          <dt>お客様名</dt><dd id="dup-customerName"></dd>
          <dt>理由</dt><dd id="dup-reason"></dd>
          <dt>日延後</dt><dd id="dup-postDelay"></dd>
        </dl>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" id="dup-edit-btn" class="btn btn-primary">元データを編集する</button>
      <button type="button" id="dup-clear-btn" class="btn btn-danger">入力をクリアする</button>
      <button type="button" id="dup-close-btn" class="modal-close-link">閉じる（入力内容は保持）</button>
    </div>
  </div>
</div>

<style>
  .status-toggle {
    display: flex;
    gap: 8px;
  }
  .status-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    background: #fff;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    user-select: none;
  }
  .status-option input[type="radio"] {
    accent-color: var(--color-primary);
    width: 18px;
    height: 18px;
  }
  .status-option:has(input:checked) {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
    color: var(--color-primary-dark);
  }
</style>

<script>
const FormPage = (function() {
  const MAX_SLIPS = 10;
  let slipCount = 0;
  let editingRowIndex = null;

  function createSlipRow(initialSlipNo, initialAmount) {
    if (slipCount >= MAX_SLIPS) return null;
    slipCount++;
    const container = document.getElementById('slips-container');
    const row = document.createElement('div');
    row.className = 'slip-row';
    row.innerHTML = `
      <input type="text" class="form-input slip-input slip-no" inputmode="numeric" maxlength="6" placeholder="伝票No 6桁">
      <input type="number" class="form-input amount-input slip-amount" inputmode="numeric" min="0" step="1" placeholder="販売金額">
      <button type="button" class="remove-btn" aria-label="この行を削除">🗑</button>
    `;
    container.appendChild(row);
    if (initialSlipNo !== undefined) row.querySelector('.slip-no').value = initialSlipNo;
    if (initialAmount !== undefined) row.querySelector('.slip-amount').value = initialAmount;
    row.querySelector('.remove-btn').addEventListener('click', () => {
      if (slipCount > 1) {
        row.remove();
        slipCount--;
        updateRemoveButtons();
        updateAddButton();
      }
    });
    updateRemoveButtons();
    updateAddButton();
    return row;
  }

  function updateRemoveButtons() {
    const rows = document.querySelectorAll('#slips-container .slip-row');
    rows.forEach(r => {
      const btn = r.querySelector('.remove-btn');
      btn.disabled = rows.length <= 1;
    });
  }

  function updateAddButton() {
    document.getElementById('add-slip-btn').disabled = slipCount >= MAX_SLIPS;
  }

  function loadReasons() {
    google.script.run
      .withSuccessHandler(res => {
        const sel = document.getElementById('reason');
        const current = sel.value;
        sel.innerHTML = '<option value="">選択してください</option>';
        if (res && res.success) {
          res.reasons.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r;
            opt.textContent = r;
            sel.appendChild(opt);
          });
          if (current && res.reasons.indexOf(current) !== -1) sel.value = current;
        }
      })
      .withFailureHandler(err => {
        App.showToast('理由の取得に失敗: ' + err.message, 'error');
      })
      .getReasons();
  }

  function setFieldError(id, msg) {
    const input = document.getElementById(id);
    const err = document.getElementById('err-' + id);
    if (msg) {
      if (input) input.classList.add('input-error');
      if (err) { err.textContent = msg; err.classList.add('show'); }
    } else {
      if (input) input.classList.remove('input-error');
      if (err) { err.textContent = ''; err.classList.remove('show'); }
    }
  }

  function clearErrors() {
    ['deliveryDate', 'storeName', 'salesPerson', 'customerName', 'reason', 'postDelayDate']
      .forEach(id => setFieldError(id, ''));
    document.querySelectorAll('.slip-row .form-input').forEach(i => i.classList.remove('input-error'));
  }

  function hasWhitespace(s) { return /[\s　]/.test(s); }

  function getPostDelayStatus() {
    const checked = document.querySelector('input[name="postDelayDateStatus"]:checked');
    return checked ? checked.value : '決定';
  }

  function syncPostDelayInputs() {
    const status = getPostDelayStatus();
    document.getElementById('post-delay-decided-wrap').style.display = (status === '決定') ? '' : 'none';
    document.getElementById('post-delay-pending-wrap').style.display = (status === '未定') ? '' : 'none';
  }

  function validate() {
    clearErrors();
    let ok = true;
    const data = {};

    const deliveryDate = document.getElementById('deliveryDate').value;
    if (!deliveryDate) { setFieldError('deliveryDate', '配送日を選択してください'); ok = false; }
    data.deliveryDate = deliveryDate;

    const slips = [];
    const rows = document.querySelectorAll('#slips-container .slip-row');
    let firstSlipError = null;
    rows.forEach((row, idx) => {
      const noInput = row.querySelector('.slip-no');
      const amountInput = row.querySelector('.slip-amount');
      const no = noInput.value.trim();
      const amount = amountInput.value.trim();
      let rowOk = true;
      if (!/^\d{6}$/.test(no)) {
        noInput.classList.add('input-error');
        rowOk = false;
        if (!firstSlipError) firstSlipError = (idx + 1) + '行目: 伝票Noは6桁の数字で入力してください';
      }
      if (amount === '' || isNaN(Number(amount)) || Number(amount) < 0) {
        amountInput.classList.add('input-error');
        rowOk = false;
        if (!firstSlipError) firstSlipError = (idx + 1) + '行目: 販売金額を正しく入力してください';
      }
      if (rowOk) slips.push({ slipNo: no, amount: Number(amount) });
    });
    if (firstSlipError) { App.showToast(firstSlipError, 'error'); ok = false; }
    if (slips.length === 0) ok = false;
    data.slips = slips;

    const storeName = document.getElementById('storeName').value.trim();
    if (!storeName) { setFieldError('storeName', '店舗名を入力してください'); ok = false; }
    else if (!/^\d+$/.test(storeName)) { setFieldError('storeName', '店舗名は数字のみで入力してください'); ok = false; }
    data.storeName = storeName;

    const salesPerson = document.getElementById('salesPerson').value;
    if (!salesPerson.trim()) { setFieldError('salesPerson', '販売担当者を入力してください'); ok = false; }
    else if (hasWhitespace(salesPerson)) { setFieldError('salesPerson', '空白を含めることはできません'); ok = false; }
    data.salesPerson = salesPerson;

    const customerName = document.getElementById('customerName').value;
    if (!customerName.trim()) { setFieldError('customerName', 'お客様名を入力してください'); ok = false; }
    else if (hasWhitespace(customerName)) { setFieldError('customerName', '空白を含めることはできません'); ok = false; }
    data.customerName = customerName;

    const reason = document.getElementById('reason').value;
    if (!reason) { setFieldError('reason', '理由を選択してください'); ok = false; }
    data.reason = reason;

    const status = getPostDelayStatus();
    data.postDelayDateStatus = status;
    if (status === '決定') {
      const v = document.getElementById('postDelayDateDecided').value;
      if (!v) { setFieldError('postDelayDate', '日延後の配送日を選択してください'); ok = false; }
      data.postDelayDate = v;
    } else {
      const v = document.getElementById('postDelayDatePending').value.trim();
      if (!v) { setFieldError('postDelayDate', '日延後の状況を入力してください'); ok = false; }
      data.postDelayDate = v;
    }

    return ok ? data : null;
  }

  function submit(e) {
    e.preventDefault();
    const data = validate();
    if (!data) return;

    const btn = document.getElementById('submit-btn');
    const isEdit = editingRowIndex !== null;
    btn.disabled = true;
    btn.textContent = isEdit ? '更新中...' : '送信中...';

    const handler = res => {
      btn.disabled = false;
      btn.textContent = isEdit ? '更新する' : '登録する';
      if (res && res.success) {
        App.showToast(isEdit ? '更新しました' : '登録しました', 'success');
        exitEditMode();
        resetForm();
      } else if (res && res.duplicate) {
        showDuplicateModal(res.duplicate);
      } else {
        alert((isEdit ? '更新' : '登録') + 'に失敗しました: ' + ((res && res.error) || '不明なエラー'));
      }
    };
    const failure = err => {
      btn.disabled = false;
      btn.textContent = isEdit ? '更新する' : '登録する';
      alert('通信エラー: ' + err.message);
    };

    if (isEdit) {
      google.script.run.withSuccessHandler(handler).withFailureHandler(failure)
        .updateRecord(editingRowIndex, data);
    } else {
      google.script.run.withSuccessHandler(handler).withFailureHandler(failure)
        .saveRecord(data);
    }
  }

  function formatTimestamp(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString('ja-JP', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function showDuplicateModal(dup) {
    const r = dup.record || {};
    const postDelay = r.postDelayDate
      ? (r.postDelayDateStatus === '決定' ? r.postDelayDate : '未定: ' + r.postDelayDate)
      : '-';
    document.getElementById('dup-slip').textContent = dup.slipNo || '';
    document.getElementById('dup-timestamp').textContent = formatTimestamp(r.timestamp);
    document.getElementById('dup-deliveryDate').textContent = r.deliveryDate || '-';
    document.getElementById('dup-slipNumbers').textContent = r.slipNumbers || '-';
    document.getElementById('dup-totalAmount').textContent = '¥' + Number(r.totalAmount || 0).toLocaleString('ja-JP');
    document.getElementById('dup-storeName').textContent = r.storeName || '-';
    document.getElementById('dup-salesPerson').textContent = r.salesPerson || '-';
    document.getElementById('dup-customerName').textContent = r.customerName || '-';
    document.getElementById('dup-reason').textContent = r.reason || '-';
    document.getElementById('dup-postDelay').textContent = postDelay;

    const modal = document.getElementById('dup-modal');
    modal.style.display = 'flex';
    modal.dataset.slipNo = dup.slipNo || '';
  }

  function hideDuplicateModal() {
    document.getElementById('dup-modal').style.display = 'none';
  }

  function resetForm() {
    document.getElementById('record-form').reset();
    document.getElementById('slips-container').innerHTML = '';
    slipCount = 0;
    createSlipRow();
    syncPostDelayInputs();
    clearErrors();
  }

  function enterEditMode(record) {
    editingRowIndex = record.rowIndex;
    document.getElementById('edit-banner').style.display = '';
    document.getElementById('form-title').textContent = '日延案件 編集';
    document.getElementById('submit-btn').textContent = '更新する';

    document.getElementById('deliveryDate').value = record.deliveryDate || '';
    document.getElementById('storeName').value = record.storeName || '';
    document.getElementById('salesPerson').value = record.salesPerson || '';
    document.getElementById('customerName').value = record.customerName || '';

    // 伝票行を組み立て
    document.getElementById('slips-container').innerHTML = '';
    slipCount = 0;
    const nos = String(record.slipNumbers || '').split('/').filter(Boolean);
    const amounts = String(record.amountBreakdown || '').split('/').filter(s => s !== '');
    if (nos.length === 0) {
      createSlipRow();
    } else {
      nos.forEach((no, i) => {
        const amt = (amounts[i] !== undefined && amounts[i] !== '') ? amounts[i] : '';
        createSlipRow(no, amt);
      });
    }

    // 理由は loadReasons 完了後にセット
    loadReasonsAndSelect(record.reason);

    // 日延後の配送日
    const status = (record.postDelayDateStatus === '決定') ? '決定' : '未定';
    document.querySelector('input[name="postDelayDateStatus"][value="' + status + '"]').checked = true;
    if (status === '決定') {
      document.getElementById('postDelayDateDecided').value = record.postDelayDate || '';
      document.getElementById('postDelayDatePending').value = '';
    } else {
      document.getElementById('postDelayDateDecided').value = '';
      document.getElementById('postDelayDatePending').value = record.postDelayDate || '';
    }
    syncPostDelayInputs();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function loadReasonsAndSelect(value) {
    google.script.run
      .withSuccessHandler(res => {
        const sel = document.getElementById('reason');
        sel.innerHTML = '<option value="">選択してください</option>';
        if (res && res.success) {
          const reasons = res.reasons || [];
          // 既存値がマスタになければ一時オプションを追加
          if (value && reasons.indexOf(value) === -1) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = value + '（マスタ未登録）';
            sel.appendChild(opt);
          }
          reasons.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r;
            opt.textContent = r;
            sel.appendChild(opt);
          });
          if (value) sel.value = value;
        }
      })
      .getReasons();
  }

  function exitEditMode() {
    editingRowIndex = null;
    document.getElementById('edit-banner').style.display = 'none';
    document.getElementById('form-title').textContent = '日延案件 登録';
    document.getElementById('submit-btn').textContent = '登録する';
  }

  return {
    init: function() {
      createSlipRow();
      syncPostDelayInputs();
      document.getElementById('add-slip-btn').addEventListener('click', () => createSlipRow());
      document.getElementById('record-form').addEventListener('submit', submit);
      document.querySelectorAll('input[name="postDelayDateStatus"]').forEach(r => {
        r.addEventListener('change', syncPostDelayInputs);
      });
      document.getElementById('cancel-edit-btn').addEventListener('click', () => {
        exitEditMode();
        resetForm();
        App.showToast('編集をキャンセルしました');
      });

      // 重複モーダルのボタン
      document.getElementById('dup-edit-btn').addEventListener('click', () => {
        const slipNo = document.getElementById('dup-modal').dataset.slipNo || '';
        hideDuplicateModal();
        exitEditMode();
        resetForm();
        if (typeof SearchPage !== 'undefined') {
          SearchPage.setPendingQuery(slipNo);
        }
        App.switchPage('search');
      });
      document.getElementById('dup-clear-btn').addEventListener('click', () => {
        hideDuplicateModal();
        exitEditMode();
        resetForm();
        App.showToast('入力をクリアしました');
      });
      document.getElementById('dup-close-btn').addEventListener('click', () => {
        hideDuplicateModal();
      });
    },
    onShow: function() {
      if (editingRowIndex === null) loadReasons();
    },
    loadForEdit: function(record) {
      enterEditMode(record);
    },
    isEditing: function() {
      return editingRowIndex !== null;
    }
  };
})();

FormPage.init();
</script>
